# FRMS nginx 리버스 프록시 설정
#
# 설치: /etc/nginx/sites-available/frms 로 복사 후 심볼릭 링크
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/frms
#   sudo ln -s /etc/nginx/sites-available/frms /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# server_name을 실제 도메인으로 바꾼 뒤 certbot으로 HTTPS를 적용한다:
#   sudo certbot --nginx -d your-domain.example.com

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;

    # 정적 파일은 nginx가 직접 서빙한다 (app/static 심볼릭 경로).
    location /static/ {
        alias /opt/frms/app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
